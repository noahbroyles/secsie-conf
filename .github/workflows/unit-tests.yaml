name: Unit Tests

on:
  push:
    branches:
      - 'master'
      - 'version-**'
    paths:
      - 'secsie/**'
      - 'tests/**'
      - 'setup.py'
      - '.github/workflows/unit-tests.yaml'
  pull_request:
    paths:
      - 'secsie/**'
      - 'tests/**'
      - 'setup.py'
      - '.github/workflows/unit-tests.yaml'
  # Lets the deploy workflow run these same tests before it publishes anything
  workflow_call:


jobs:
  unit-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Test with pytest
      run: |
        python -m pytest

    # After the tests, so the build files this leaves behind can't get in their way
    - name: Check that the package installs
      run: |
        python -m pip install .
        # Move out of the checkout, so that it is the installed package that gets imported and not the source folder
        cd "$RUNNER_TEMP"
        python -c "import secsie; print(secsie.__file__, secsie.__version__)"
