name: PyPi Deployment

on:
  release:
    types: [published]


jobs:
  # Nothing is published unless the tests pass on every supported version of Python
  test:
    name: Run the unit tests
    uses: ./.github/workflows/unit-tests.yaml

  deploy:
    name: Deploy Package to PyPi
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install build and twine
        run: python -m pip install build twine

      # Builds in its own isolated environment, so it doesn't matter which build tools this Python comes with
      - name: Build package
        run: python -m build

      - name: Upload to PyPi
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
